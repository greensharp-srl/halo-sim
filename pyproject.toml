[project]
name = "halo-sim"
version = "0.1.0"
description = "Phone-backed simulator for Brilliant Labs Halo glasses: run unmodified brilliant-sdk apps with your phone as camera, mic, IMU, speaker and display."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "halo-emulator>=2.2.0",
    "brilliant-sdk",
    "brilliant-msg",
    "brilliant-ble",
    "aiohttp>=3.9",
    "numpy>=2.0",
    "pillow>=11.0",
    "lc3py>=1.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
halo-sim = "halo_sim.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halo_sim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
